[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "laboratory_sealing"
version = "0.1.0"
description = "Exercise 0: Sealing the room"
authors = ["Your Name <onorina>"]

[tool.poetry.dependencies]
python = ">=3.10"
pandas = ">=2.0.0"
numpy = ">=1.24.0"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
